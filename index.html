<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>設計需求單</title>
<style>
:root{--paper:#F3F5F7;--sheet:#fff;--ink:#1B2430;--ink2:#4A5666;--ink3:#7C8796;--rule:#D8DEE5;--teal:#0E6B6B;--teal-ink:#fff;--static:#2D5BD3;--motion:#C2185B;--done:#7C8796}
@media (prefers-color-scheme:dark){:root{--paper:#151A20;--sheet:#1D242C;--ink:#E7ECF1;--ink2:#B3BDC8;--ink3:#8692A0;--rule:#313B46;--teal:#4FB3AE;--teal-ink:#0B1A1A;--static:#7EA2FF;--motion:#FF7BAA;--done:#8692A0}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.6}
main{max-width:920px;margin:0 auto;padding:40px 20px 60px}
h1{font-size:28px;margin:0 0 4px}
.lede{color:var(--ink2);margin:0 0 20px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.f{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:5px 14px;font:inherit;font-size:14px;cursor:pointer}
.f[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:18px 20px;margin-bottom:12px;display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:start}
.card.done{opacity:.7}
.card h2{margin:0;font-size:19px}
.meta{color:var(--ink2);font-size:14px}
.nums{font-size:14px;color:var(--ink2)}
.nums b{color:var(--ink)} .m{color:var(--motion)} .s{color:var(--static)}
.st{font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;border:1px solid currentColor;justify-self:end}
.st.on{color:var(--teal)} .st.off{color:var(--done)}
.acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{display:inline-block;border:1px solid var(--teal);border-radius:8px;padding:7px 14px;font-size:14px;font-weight:600;text-decoration:none}
.btn.p{background:var(--teal);color:var(--teal-ink)} .btn.g{color:var(--teal)}
.empty{color:var(--ink2);text-align:center;padding:40px 0}
</style>
</head>
<body><main>
<h1>設計需求單</h1>
<p class="lede">點「開啟需求單」查看各主題的規格與文案，或直接下載 Excel。</p>
<div class="tools" id="tools"></div>
<div id="list"><p class="empty">載入中…</p></div>
</main>
<script>
let all = [], filter = "進行中";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function draw(){
  const opts = ["進行中","已完成","全部"];
  document.getElementById("tools").innerHTML = opts.map(o => `<button class="f" aria-pressed="${o===filter}" onclick="filter='${o}';draw()">${o}</button>`).join("");
  const rows = all.filter(b => filter==="全部" || b.status===filter).sort((a,b)=>b.date.localeCompare(a.date));
  document.getElementById("list").innerHTML = rows.length ? rows.map(b => `
    <article class="card ${b.status==="已完成"?"done":""}">
      <h2>${esc(b.title)}</h2><span class="st ${b.status==="已完成"?"off":"on"}">${esc(b.status)}</span>
      <div class="meta">${esc(b.market)}・${esc(b.langs)}・${esc(b.platforms)}・${esc(b.date)}</div>
      <div class="nums"><b>${b.posts}</b> 則貼文・<b>${b.assets}</b> 款素材（<span class="m">動態 ${b.motion}</span>／<span class="s">靜態 ${b.static}</span>）</div>
      <div class="acts"><a class="btn p" href="${encodeURI(b.slug)}/">開啟需求單</a>${b.excel?`<a class="btn g" href="${encodeURI(b.slug+"/"+b.excel)}" download="${esc(b.title.replace(/\s+/g,"_"))}_設計需求表.xlsx">下載 Excel</a>`:""}</div>
    </article>`).join("") : `<p class="empty">目前沒有${filter==="全部"?"":filter}的需求單。</p>`;
}
fetch("briefs.json", {cache:"no-store"}).then(r => r.json()).then(d => { all = d; draw(); })
  .catch(() => { document.getElementById("list").innerHTML = '<p class="empty">需求單清單讀取失敗，請重新整理。</p>'; });
</script>
</body></html>
